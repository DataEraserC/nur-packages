# qq-bridge DSH bundle: MCP servers for QQ ↔ DSH bridge.
# Paths are substituted at build time by Nix.
#
# QQ_BRIDGE_HOME: MCP servers need to read config.json and state/ from the
# runtime data directory (~/.local/share/qq-bridge by default), not from the
# read-only Nix store where they are installed. The patched source tree under
# @PKGDIR@/src/ has ROOT modified to respect this env var.
- insert:
    - id: mcp-snowluma
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: snowluma
        transport: stdio
        command: "@NODE@"
        args:
          - "@PKGDIR@/src/mcp-snowluma-safe.js"
        env:
          QQ_BRIDGE_HOME: "@QQ_BRIDGE_HOME@"
        toolCallTimeoutMs: 725000
    - id: mcp-snowluma-host
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: snowluma-host
        transport: stdio
        command: "@NODE@"
        args:
          - "@PKGDIR@/src/mcp-host-server.js"
        env:
          QQ_BRIDGE_HOME: "@QQ_BRIDGE_HOME@"
    - id: mcp-web-search-safe
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: web-search-safe
        transport: stdio
        command: "@NODE@"
        args:
          - "@PKGDIR@/src/mcp-web-search-safe.js"
