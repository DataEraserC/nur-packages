name: 'Auto update packages'
on:
  workflow_dispatch:
  schedule:
    - cron: '13 20 * * *'
permissions:
  actions: write
  contents: write
# Two overlapping auto-update runs both commit to main and can cancel each
# other; a queued run must wait instead of superseding a running one.
concurrency:
  group: auto-update
  cancel-in-progress: false
jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIT_SSL_NO_VERIFY: 'true'
      # Bound each package's update script (see helpers/update.nix) so one
      # stalled download cannot hold `wait -n` until GitHub cancels the run.
      UPDATE_PACKAGE_TIMEOUT: '600'
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the push-retry step rebases onto a moved origin/main,
          # and a shallow clone has no parent commit to replay the local commit
          # against. The pack is small (tens of MiB), so this costs little.
          fetch-depth: 0

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Create nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations
            extra-experimental-features = nix-command flakes ca-derivations
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
            build-dir = /nix/tmpdir
            log-lines = 25

      - name: Speed Up nix
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update packages
        continue-on-error: true
        timeout-minutes: 100
        env:
          # api.github.com allows 60 unauthenticated requests per hour per IP
          # and shared runners exhaust that, which surfaced as HTTP 403 in the
          # update scripts' curl calls. Pass a token down to them (see
          # tools/github-api.sh); fall back to the default token when the
          # automerge token is unavailable.
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p /nix/tmpdir2
          sudo chown "$(whoami)" /nix/tmpdir2
          export TMPDIR=/nix/tmpdir2
          # Per-package logs land here instead of a scratch dir that is deleted
          # on exit, so the upload step below can ship them.
          export UPDATE_LOG_DIR="$PWD/update-logs"

          nix run .#update

      - name: Write job summary
        if: always()
        run: |
          if [ -f update-results.json ]; then
            SUCCESS=$(jq '[.[] | select(.status == "success")] | length' update-results.json)
            FAILED=$(jq '[.[] | select(.status == "failed")] | length' update-results.json)
            TOTAL=$((SUCCESS + FAILED))
            {
              echo "## Update Results"
              echo ""
              echo "| Package | Status | Log |"
              echo "|---------|--------|-----|"
              # Failed packages keep a per-package log (see UPDATE_LOG_DIR in
              # helpers/update.nix); name it here so the artifact is easy to
              # navigate instead of being a pile of anonymous files.
              jq -r 'sort_by(.status != "failed") | .[] | .attrPath as $a | "| \($a) | \(.status) | \(if .status == "failed" then "\($a | gsub("[./]"; "__")).log" else "-" end) |"' update-results.json
              echo ""
              echo "**Total:** $TOTAL | **Success:** $SUCCESS | **Failed:** $FAILED"
              if [ "$FAILED" -gt 0 ]; then
                echo ""
                echo "Failed package logs are in the **update-logs** artifact."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload update results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-results
          path: update-results.json
          if-no-files-found: ignore

      # The console interleaves package output, because the runner drives
      # UPDATE_PACKAGE_JOBS packages in parallel and prints each one's block
      # whenever it finishes. Only failures keep a log, so this artifact is
      # one self-contained file per failed package.
      - name: Upload per-package update logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-logs
          path: update-logs/
          if-no-files-found: ignore

      # A failed update script may leave partial edits in the working tree:
      # e.g. nix-update bumps version + src hash, then fails while probing
      # pnpmDeps.hash, and the stale lockfile is never regenerated. Those
      # edits must not be committed. The update runner records each failed
      # package's repo-relative dir in update-rollback.jsonl while evaluation
      # is still good; restore just those dirs here, after all updates finish.
      # This is the single source of truth for "a failed package is not
      # updated" — no placeholder-hash heuristics needed.
      - name: Roll back failed package updates
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s update-rollback.jsonl ]; then
            echo "No failed packages to roll back."
            exit 0
          fi
          while IFS= read -r entry; do
            dir=$(jq -r .dir <<<"$entry")
            attr=$(jq -r .attrPath <<<"$entry")
            # Safety: only ever restore paths inside pkgs/ with no traversal.
            case "$dir" in
              pkgs/*) ;;
              *) echo "::error::refusing rollback of unexpected dir '$dir' for $attr"; exit 1 ;;
            esac
            case "$dir" in
              *..*) echo "::error::refusing rollback path with '..': '$dir' for $attr"; exit 1 ;;
            esac
            if [ ! -d "$dir" ]; then
              echo "::warning::rollback dir missing, skipping: $dir ($attr)"
              continue
            fi
            echo "Rolling back $attr -> $dir"
            git checkout HEAD -- "$dir"
            git clean -fd -- "$dir"
          done < update-rollback.jsonl

      - name: Commit back to repository
        if: always()
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          # https://github.com/cpina/github-action-push-to-another-repository/issues/75
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global user.email "DataEraserC-bot@users.noreply.github.com"
          git config --global user.name "DataEraserC-bot"

          rm -f update-results.json update-rollback.jsonl
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "auto: update packages"

          git remote remove origin || true
          git remote add origin "https://DataEraserC:$API_TOKEN_GITHUB@github.com/DataEraserC/nur-packages.git"

          # The update run takes tens of minutes, so main often moves while it
          # is building (another auto-update, a manual push, a merge). Rebase
          # onto the new head and retry instead of dropping the whole run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt; syncing with origin/main"
            if ! git fetch origin main; then
              sleep $((attempt * 10))
              continue
            fi
            if git rebase origin/main; then
              continue
            fi
            # Rebase replays commits one at a time, so an intermediate conflict
            # aborts it even when the tips merge cleanly (or when a local commit
            # is already applied upstream and would become empty). A single
            # three-way merge of the two tips still succeeds in those cases.
            echo "rebase onto origin/main failed; trying a merge instead"
            git rebase --abort || true
            if git merge --no-edit origin/main; then
              continue
            fi
            echo "merge also conflicted; cannot reconcile automatically" >&2
            git merge --abort || true
            git status --short >&2
            exit 1
          done
          echo "giving up after 3 push attempts" >&2
          exit 1
