name: 'Auto update packages'
on:
  workflow_dispatch:
  schedule:
    - cron: '13 20 * * *'
permissions:
  actions: write
  contents: write
jobs:
  auto-update:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: 'true'
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the push-retry step rebases onto a moved origin/main,
          # and a shallow clone has no parent commit to replay the local commit
          # against. The pack is small (tens of MiB), so this costs little.
          fetch-depth: 0

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Create nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations
            extra-experimental-features = nix-command flakes ca-derivations
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
            build-dir = /nix/tmpdir
            log-lines = 25

      - name: Speed Up nix
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update packages
        continue-on-error: true
        run: |
          sudo mkdir -p /nix/tmpdir2
          sudo chown "$(whoami)" /nix/tmpdir2
          export TMPDIR=/nix/tmpdir2

          nix run .#update

      - name: Write job summary
        if: always()
        run: |
          if [ -f update-results.json ]; then
            SUCCESS=$(jq '[.[] | select(.status == "success")] | length' update-results.json)
            FAILED=$(jq '[.[] | select(.status == "failed")] | length' update-results.json)
            TOTAL=$((SUCCESS + FAILED))
            {
              echo "## Update Results"
              echo ""
              echo "| Package | Status |"
              echo "|---------|--------|"
              jq -r 'sort_by(.status != "failed") | .[] | "| \(.attrPath) | \(.status) |"' update-results.json
              echo ""
              echo "**Total:** $TOTAL | **Success:** $SUCCESS | **Failed:** $FAILED"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload update results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-results
          path: update-results.json
          if-no-files-found: ignore

      - name: Commit back to repository
        if: always()
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          # https://github.com/cpina/github-action-push-to-another-repository/issues/75
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global user.email "DataEraserC-bot@users.noreply.github.com"
          git config --global user.name "DataEraserC-bot"

          rm -f update-results.json
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "auto: update packages"

          git remote remove origin || true
          git remote add origin "https://DataEraserC:$API_TOKEN_GITHUB@github.com/DataEraserC/nur-packages.git"

          # The update run takes tens of minutes, so main often moves while it
          # is building (another auto-update, a manual push, a merge). Rebase
          # onto the new head and retry instead of dropping the whole run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt; syncing with origin/main"
            if ! git fetch origin main; then
              sleep $((attempt * 10))
              continue
            fi
            if git rebase origin/main; then
              continue
            fi
            # Rebase replays commits one at a time, so an intermediate conflict
            # aborts it even when the tips merge cleanly (or when a local commit
            # is already applied upstream and would become empty). A single
            # three-way merge of the two tips still succeeds in those cases.
            echo "rebase onto origin/main failed; trying a merge instead"
            git rebase --abort || true
            if git merge --no-edit origin/main; then
              continue
            fi
            echo "merge also conflicted; cannot reconcile automatically" >&2
            git merge --abort || true
            git status --short >&2
            exit 1
          done
          echo "giving up after 3 push attempts" >&2
          exit 1
